name: Sign security-owner decision

on:
  workflow_dispatch:
    inputs:
      approved_head_sha:
        description: Exact reviewed middleware commit SHA
        required: true
        type: string
      approved_scope:
        description: Must be server_a_isolated_staging
        required: true
        type: string
      decision_expiration:
        description: UTC expiration in YYYY-MM-DDTHH:MM:SSZ format
        required: true
        type: string
      security_owner_authority_reference:
        description: Independently verifiable security-owner authority artifact reference
        required: true
        type: string
      middleware_digest:
        description: Immutable middleware image digest
        required: true
        type: string
      n8n_digest:
        description: Immutable n8n image digest
        required: true
        type: string
      odoo_digest:
        description: Immutable Odoo image digest
        required: true
        type: string
      postgresql_digest:
        description: Immutable PostgreSQL image digest
        required: true
        type: string
      redis_digest:
        description: Immutable Redis image digest
        required: true
        type: string
      security_finding_exception_reference:
        description: Exact exception artifact reference, or an explicit no-exception policy reference
        required: true
        type: string
      security_findings_json:
        description: Non-empty JSON array of digest-bound security findings
        required: true
        type: string
      compensating_controls_json:
        description: Non-empty JSON array of compensating controls and remediation deadlines
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: security-owner-decision-sign-main
  cancel-in-progress: false

jobs:
  sign-decision:
    if: github.repository == 'Codestra-SRL/codestra-middleware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: security-owner-decision-signing
    timeout-minutes: 15
    env:
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_IDENTITY: https://github.com/Codestra-SRL/codestra-middleware/.github/workflows/security-owner-decision-sign.yml@refs/heads/main
      APPROVED_HEAD_SHA: ${{ inputs.approved_head_sha }}
      APPROVED_SCOPE: ${{ inputs.approved_scope }}
      DECISION_EXPIRATION: ${{ inputs.decision_expiration }}
      SECURITY_OWNER_AUTHORITY_REFERENCE: ${{ inputs.security_owner_authority_reference }}
      MIDDLEWARE_DIGEST: ${{ inputs.middleware_digest }}
      N8N_DIGEST: ${{ inputs.n8n_digest }}
      ODOO_DIGEST: ${{ inputs.odoo_digest }}
      POSTGRESQL_DIGEST: ${{ inputs.postgresql_digest }}
      REDIS_DIGEST: ${{ inputs.redis_digest }}
      SECURITY_FINDING_EXCEPTION_REFERENCE: ${{ inputs.security_finding_exception_reference }}
      SECURITY_FINDINGS_JSON: ${{ inputs.security_findings_json }}
      COMPENSATING_CONTROLS_JSON: ${{ inputs.compensating_controls_json }}
    steps:
      - name: Check out protected main workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected context and decision inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "Codestra-SRL/codestra-middleware"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${APPROVED_SCOPE}" = "server_a_isolated_staging"
          [[ "${APPROVED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          for digest in \
            "${MIDDLEWARE_DIGEST}" \
            "${N8N_DIGEST}" \
            "${ODOO_DIGEST}" \
            "${POSTGRESQL_DIGEST}" \
            "${REDIS_DIGEST}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          [[ "${DECISION_EXPIRATION}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
          expiration_epoch=$(date -u --date="${DECISION_EXPIRATION}" +%s)
          now_epoch=$(date -u +%s)
          maximum_epoch=$((now_epoch + 90 * 24 * 60 * 60))
          (( expiration_epoch > now_epoch ))
          (( expiration_epoch <= maximum_epoch ))
          for required_text in \
            "${SECURITY_OWNER_AUTHORITY_REFERENCE}" \
            "${SECURITY_FINDING_EXCEPTION_REFERENCE}" \
            "${SECURITY_FINDINGS_JSON}" \
            "${COMPENSATING_CONTROLS_JSON}"; do
            [[ "${required_text}" =~ [^[:space:]] ]]
          done
          jq -ce 'select(type == "array" and length > 0)' \
            <<<"${SECURITY_FINDINGS_JSON}" > security-findings.json
          jq -ce 'select(type == "array" and length > 0)' \
            <<<"${COMPENSATING_CONTROLS_JSON}" > compensating-controls.json
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/commits/${APPROVED_HEAD_SHA}"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output approved-commit.json \
            "${api_url}"
          test "$(jq -r '.sha' approved-commit.json)" = "${APPROVED_HEAD_SHA}"

      - name: Generate canonical deterministic decision document
        shell: bash
        run: |
          set -euo pipefail
          jq -cnS \
            --arg approved_head_sha "${APPROVED_HEAD_SHA}" \
            --arg approved_scope "${APPROVED_SCOPE}" \
            --arg decision_expiration "${DECISION_EXPIRATION}" \
            --arg authority_reference "${SECURITY_OWNER_AUTHORITY_REFERENCE}" \
            --arg middleware_digest "${MIDDLEWARE_DIGEST}" \
            --arg n8n_digest "${N8N_DIGEST}" \
            --arg odoo_digest "${ODOO_DIGEST}" \
            --arg postgresql_digest "${POSTGRESQL_DIGEST}" \
            --arg redis_digest "${REDIS_DIGEST}" \
            --arg exception_reference "${SECURITY_FINDING_EXCEPTION_REFERENCE}" \
            --slurpfile findings security-findings.json \
            --slurpfile controls compensating-controls.json \
            '{
              schema: "codestra.security-owner-decision/v1",
              decision: "SECURITY_OWNER_REVIEW",
              approved_head_sha: $approved_head_sha,
              approved_scope: $approved_scope,
              expires_utc: $decision_expiration,
              security_owner_authority_reference: $authority_reference,
              image_digests: {
                middleware: $middleware_digest,
                n8n: $n8n_digest,
                odoo: $odoo_digest,
                postgresql: $postgresql_digest,
                redis: $redis_digest
              },
              security_finding_exception_reference: $exception_reference,
              security_findings: $findings[0],
              compensating_controls: $controls[0],
              gates: {
                production_deployment: "BLOCKED",
                production_activation: "BLOCKED",
                server_b_access: "BLOCKED",
                customer_data_access: "BLOCKED"
              }
            }' > security-owner-decision.json
          jq -ceS . security-owner-decision.json > canonical-decision.json
          cmp --silent security-owner-decision.json canonical-decision.json
          mv canonical-decision.json security-owner-decision.json
          sha256sum security-owner-decision.json > security-owner-decision.json.sha256

      - name: Install checksum-pinned Cosign
        shell: bash
        env:
          COSIGN_VERSION: v3.1.2
          COSIGN_SHA256: f7622ed3cf22e55e1ae6377c080979ff77a22da9981c11df222a2e444991e7cf
        run: |
          set -euo pipefail
          url="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/cosign" "${url}"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/cosign" "${RUNNER_TEMP}/bin-cosign"
          "${RUNNER_TEMP}/bin-cosign" version > cosign-version.txt

      - name: Sign canonical decision with keyless Sigstore
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin-cosign" sign-blob \
            --yes \
            --bundle security-owner-decision.sigstore.json \
            security-owner-decision.json

      - name: Verify exact signer identity issuer and bundle
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/bin-cosign" verify-blob \
            --bundle security-owner-decision.sigstore.json \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
            security-owner-decision.json \
            > security-owner-decision.verification.txt
          sha256sum -c security-owner-decision.json.sha256
          sha256sum \
            security-owner-decision.json \
            security-owner-decision.json.sha256 \
            security-owner-decision.sigstore.json \
            security-owner-decision.verification.txt \
            cosign-version.txt \
            .github/workflows/security-owner-decision-sign.yml \
            > signed-decision-artifacts.sha256

      - name: Upload immutable run-scoped decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-owner-decision-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          overwrite: false
          retention-days: 30
          path: |
            security-owner-decision.json
            security-owner-decision.json.sha256
            security-owner-decision.sigstore.json
            security-owner-decision.verification.txt
            signed-decision-artifacts.sha256
            cosign-version.txt
            .github/workflows/security-owner-decision-sign.yml
