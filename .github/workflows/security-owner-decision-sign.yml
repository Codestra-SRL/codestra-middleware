name: Sign security-owner decision

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number containing inert decision data
        required: true
        type: string
      pr_head_sha:
        description: Exact frozen pull request head SHA
        required: true
        type: string
      decision_request_path:
        description: Repository-relative decision request JSON path
        required: true
        type: string
      decision_request_sha256:
        description: SHA-256 of the exact decision request bytes
        required: true
        type: string
      image_manifest_path:
        description: Repository-relative image manifest JSON path
        required: true
        type: string
      image_manifest_sha256:
        description: SHA-256 of the exact image manifest bytes
        required: true
        type: string

permissions: {}

concurrency:
  group: security-owner-decision-sign-main
  cancel-in-progress: false

jobs:
  sign-decision:
    if: github.repository == 'Codestra-SRL/codestra-middleware' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: security-owner-signing
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      pull-requests: read
    env:
      EXPECTED_ISSUER: https://token.actions.githubusercontent.com
      EXPECTED_IDENTITY: https://github.com/Codestra-SRL/codestra-middleware/.github/workflows/security-owner-decision-sign.yml@refs/heads/main
      INPUT_PR_NUMBER: ${{ inputs.pr_number }}
      INPUT_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
      INPUT_DECISION_REQUEST_PATH: ${{ inputs.decision_request_path }}
      INPUT_DECISION_REQUEST_SHA256: ${{ inputs.decision_request_sha256 }}
      INPUT_IMAGE_MANIFEST_PATH: ${{ inputs.image_manifest_path }}
      INPUT_IMAGE_MANIFEST_SHA256: ${{ inputs.image_manifest_sha256 }}
    steps:
      - name: Check out protected main validator only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected context and inert-data claims
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "Codestra-SRL/codestra-middleware"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          [[ "${INPUT_PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${INPUT_PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${INPUT_DECISION_REQUEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${INPUT_IMAGE_MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          for path in "${INPUT_DECISION_REQUEST_PATH}" "${INPUT_IMAGE_MANIFEST_PATH}"; do
            [[ "${path}" =~ ^[A-Za-z0-9._/-]+$ ]]
            [[ "${path}" != /* && "${path}" != *..* ]]
          done

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(--header 'Accept: application/vnd.github+json' --header "Authorization: Bearer ${GH_TOKEN}" --header 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "${headers[@]}" --output pr.json "${api}/pulls/${INPUT_PR_NUMBER}"
          test "$(jq -r .state pr.json)" = open
          test "$(jq -r .head.sha pr.json)" = "${INPUT_PR_HEAD_SHA}"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "${headers[@]}" --output status.json "${api}/commits/${INPUT_PR_HEAD_SHA}/status"
          jq -e '.statuses | any(.context == "codestra/required-ci" and .state == "success")' status.json >/dev/null

          fetch_inert() {
            local path="$1" output="$2"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "${headers[@]}" \
              --output content.json "${api}/contents/${path}?ref=${INPUT_PR_HEAD_SHA}"
            test "$(jq -r .type content.json)" = file
            jq -r .content content.json | tr -d '\n' | base64 --decode > "${output}"
          }
          fetch_inert "${INPUT_DECISION_REQUEST_PATH}" decision-request.json
          fetch_inert "${INPUT_IMAGE_MANIFEST_PATH}" image-manifest.json
          echo "${INPUT_DECISION_REQUEST_SHA256}  decision-request.json" | sha256sum -c -
          echo "${INPUT_IMAGE_MANIFEST_SHA256}  image-manifest.json" | sha256sum -c -
          python3 scripts/security/validate-security-owner-decision.py request \
            decision-request.json image-manifest.json "${INPUT_PR_NUMBER}" "${INPUT_PR_HEAD_SHA}"

      - name: Audit protected-environment human approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output approvals.json "${api}"
          jq -ce '[.[] | select(.state == "approved" and .user.login == "kazan555" and any(.environments[]; .name == "security-owner-signing"))] | if length == 1 then .[0] else error("exact authorized environment approval required") end' \
            approvals.json > security-owner-approval-audit.json
          test "$(jq -r .user.login security-owner-approval-audit.json)" != "${GITHUB_ACTOR}"
          sha256sum security-owner-approval-audit.json > security-owner-approval-audit.sha256

      - name: Generate canonical runtime decision envelope
        shell: bash
        run: |
          set -euo pipefail
          signed_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          approval_id=$(jq -r .id security-owner-approval-audit.json)
          approver=$(jq -r .user.login security-owner-approval-audit.json)
          jq -cS \
            --arg request_sha "${INPUT_DECISION_REQUEST_SHA256}" \
            --arg approver "${approver}" \
            --arg approval_id "${approval_id}" \
            --arg workflow_sha "${GITHUB_SHA}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg signed_at_utc "${signed_at_utc}" \
            '{
              schema_version: .schema_version,
              decision_status: "approved_for_staging_preparation",
              decision_request_sha256: $request_sha,
              repository, pr_number, pr_head_sha, middleware_main_sha, odoo_main_sha,
              approved_scope,
              approved_image_digests: .image_digests,
              accepted_vulnerability_findings: .vulnerability_findings,
              compensating_controls_sha256: .compensating_controls.sha256,
              odoo_isolation_evidence_sha256: .odoo_isolation_evidence.sha256,
              middleware_isolation_evidence_sha256: .middleware_isolation_evidence.sha256,
              security_owner_approver_login: $approver,
              security_owner_authority_reference: "SECURITY.md#security-owner-approval-delegation",
              environment_name: "security-owner-signing",
              environment_approval_record_id: $approval_id,
              workflow_repository: "Codestra-SRL/codestra-middleware",
              workflow_path: ".github/workflows/security-owner-decision-sign.yml",
              workflow_ref: "refs/heads/main",
              workflow_sha: $workflow_sha,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: $workflow_run_attempt,
              signed_at_utc: $signed_at_utc,
              expires_at_utc: .requested_expiration_utc,
              negative_authorizations,
              revocation_conditions
            }' decision-request.json > security-owner-decision.json
          python3 scripts/security/validate-security-owner-decision.py decision security-owner-decision.json
          sha256sum security-owner-decision.json > security-owner-decision.sha256

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.2

      - name: Sign and verify exact decision bytes
        shell: bash
        run: |
          set -euo pipefail
          cosign version > cosign-version.txt
          cosign sign-blob --yes --bundle security-owner-decision.sigstore.json security-owner-decision.json
          cosign verify-blob \
            --bundle security-owner-decision.sigstore.json \
            --certificate-identity "${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer "${EXPECTED_ISSUER}" \
            security-owner-decision.json > verification-result.txt
          sha256sum -c security-owner-decision.sha256
          sha256sum security-owner-decision.json security-owner-decision.sha256 \
            security-owner-decision.sigstore.json security-owner-approval-audit.json \
            security-owner-approval-audit.sha256 verification-result.txt > SHA256SUMS

      - name: Upload immutable run-scoped decision evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-owner-decision-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
          path: |
            security-owner-decision.json
            security-owner-decision.sha256
            security-owner-decision.sigstore.json
            security-owner-approval-audit.json
            security-owner-approval-audit.sha256
            verification-result.txt
            SHA256SUMS
            cosign-version.txt
