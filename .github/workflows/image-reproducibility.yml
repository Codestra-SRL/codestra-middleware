name: image-reproducibility

on:
  pull_request:
    paths:
      - Dockerfile
      - requirements.lock
      - requirements-test.lock
      - .security/**
      - .github/workflows/image-reproducibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-twice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build twice and compare immutable image IDs
        run: bash .security/verify_reproducibility.sh
