name: beyvra-email-authority

on:
  pull_request:
    paths:
      - app/email/**
      - deploy/beyvra-email/**
      - requirements.in
      - requirements.lock
      - pyproject.toml
      - .github/workflows/beyvra-email-authority.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-beyvra-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/beyvra-email/Dockerfile
          load: true
          tags: codestra/beyvra-email:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: codestra/beyvra-email:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan complete source tree for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --no-git --redact --exit-code 1
